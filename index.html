<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Keybound</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07060d;
        overflow: hidden;
        /* Played with keys or thumbs: the mouse pointer would just sit over the screen. */
        cursor: none;
        /* No scrolling, zooming, text selection or long-press menu under the thumbs. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* Touch controls over the whole screen, margins included; touches pass through to the game. */
      #touch {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #07060d;
        color: #e9e4ff;
        font: 18px monospace;
        text-align: center;
      }
      /* The game is landscape only; on a phone held upright it would be a thin strip. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="touch"></canvas>
    <div id="rotate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
